name: X-SetSpawn
version: 2.3
main: com.fabian.xsetspawn.XSetSpawn
api-version: 1.13
folia-supported: true
authors: [Fabian]
website: https://xproyects.qzz.io
description: "Teleport to a custom spawn per world or global."
softdepend: [PlaceholderAPI, Vault, DecentHolograms, HolographicDisplays]

commands:
  xsetspawn:
    description: Main admin command for X-SetSpawn
    usage: /xsetspawn <reload|update|version|help|delspawn|setspawn>
    aliases: [xss]

permissions:
  xsetspawn.spawn:
    description: Allows using /spawn to teleport to spawn
    default: true
  xsetspawn.setspawn:
    description: Allows using /setspawn to set the spawn point
    default: op
  xsetspawn.delspawn:
    description: Allows using /delspawn to delete a named spawn point
    default: op
  xsetspawn.admin:
    description: Full admin access and update notifications on join
    default: op
  xsetspawn.reload:
    description: Allows reloading the plugin configuration
    default: op
  xsetspawn.update:
    description: Allows checking for plugin updates
    default: op
  xsetspawn.bypass.cooldown:
    description: Bypass the /spawn cooldown
    default: op
  xsetspawn.bypass.delay:
    description: Bypass the teleport countdown delay
    default: op
  xsetspawn.bypass.economy:
    description: Teleport to spawn for free
    default: op
  xsetspawn.locate:
    description: Allows viewing available languages
    default: op
  xsetspawn.back:
    description: Allows using /back
    default: true
  xsetspawn.spawn-on-join:
    description: Allows teleporting to spawn on join
    default: false